name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 24.x

jobs:
  quality:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [lint, typecheck, test, build]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.command }}
        run: pnpm ${{ matrix.command }}

  repository-contracts:
    name: repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Compose contract (daemon-independent)
        run: node scripts/validate-compose.mjs deploy/runtime/compose.contract.yaml --strict
      - name: Release hygiene
        run: node scripts/validate-release.mjs
      - name: Release manifest round trip
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          printf '%s\n' synthetic-artifact > "$workdir/artifact.txt"
          node scripts/generate-release-manifest.mjs --artifacts "$workdir" --output "$workdir/manifest.json" --version ci
          node scripts/verify-release-manifest.mjs "$workdir/manifest.json" "$workdir"
  container:
    name: ${{ matrix.service }} container build and scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            dockerfile: deploy/Dockerfile.server
          - service: edge
            dockerfile: deploy/Dockerfile.edge
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare OCI labels
        id: oci
        shell: bash
        run: |
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Build linux/amd64 and linux/arm64 with SBOM and provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: vault-mcp-bridge-${{ matrix.service }}:ci-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.oci.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.oci.outputs.created }}
            SOURCE=${{ steps.oci.outputs.source }}
          outputs: type=oci,dest=/tmp/vault-mcp-bridge-${{ matrix.service }}.oci.tar
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the exact multi-architecture OCI candidate
        shell: bash
        run: |
          scanner='docker.io/aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c'
          archive="/tmp/vault-mcp-bridge-${{ matrix.service }}.oci.tar"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm -v /tmp:/scan:ro "$scanner" image \
              --input "/scan/$(basename "$archive")" \
              --platform "$platform" \
              --scanners vuln \
              --format table \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1
          done
      - name: Upload OCI build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.service }}-oci-${{ github.sha }}
          path: /tmp/vault-mcp-bridge-${{ matrix.service }}.oci.tar
          if-no-files-found: error
