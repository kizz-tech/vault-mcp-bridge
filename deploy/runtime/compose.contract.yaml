# Non-deployable contract fixture. It contains synthetic IDs, image digests,
# and relative fixture paths only. Production files are generated by
# @vault-mcp-bridge/deployment and must never be copied from this file.
name: vmb-a1b2c3d4e5f6
x-vmb-nondeployable-fixture: true

services:
  server:
    image: ghcr.io/example/vault-bridge-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    depends_on:
      server_secrets_init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8787"
      SERVER_DATABASE_PATH: /var/lib/vault-mcp-bridge/vault.sqlite
      MCP_VAULT_ID: vault_fixture123456
      MCP_INSTALLATION_ID: inst_fixture123456
      MCP_RESOURCE_URL: https://mcp.example.invalid/mcp
      PUBLISHER_PUBLIC_URL: https://ingest.example.invalid/
      MCP_HOSTS: mcp.example.invalid
      PUBLISHER_HOSTS: ingest.example.invalid
      ALLOWED_HOSTS: mcp.example.invalid,ingest.example.invalid,127.0.0.1
      JWT_ISSUER: https://issuer.example.invalid/
      JWT_AUDIENCE: vault-mcp-bridge-fixture
      JWT_SCOPE: vault:read
      JWT_JWKS_FILE: /run/secrets/oauth_verification_bundle
      PUBLISHER_MTLS_REQUIRED: "true"
      PUBLISHER_EDGE_ATTESTATION_SECRET_FILE: /run/secrets/publisher_edge_attestation
      MCP_EDGE_ATTESTATION_SECRET_FILE: /run/secrets/mcp_edge_attestation
      MAX_BODY_BYTES: "16777216"
      MAX_VAULT_BYTES: "536870912"
      MAX_DATABASE_BYTES: "2147483648"
      MAX_INDEX_BYTES: "536870912"
      MAX_TEMP_BYTES: "536870912"
      MIN_FREE_BYTES: "2147483648"
      MAX_RETAINED_GENERATIONS: "2"
    volumes:
      - replica_data:/var/lib/vault-mcp-bridge
      - server_secrets:/run/secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    logging:
      driver: json-file
      options:
        max-size: 8m
        max-file: "3"
    networks:
      app_internal:
        aliases: [server]
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: server
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  server_secrets_init:
    image: ghcr.io/example/vault-bridge-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    user: "0:0"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
    entrypoint: [node]
    command:
      - --input-type=module
      - -e
      - |-
        import { chmod, chown, copyFile, mkdir, readdir, rm } from 'node:fs/promises';
        import { join } from 'node:path';
        const entries = [{"name":"publisher_edge_attestation","uid":10001,"gid":10001,"mode":288},{"name":"mcp_edge_attestation","uid":10001,"gid":10001,"mode":288},{"name":"oauth_verification_bundle","uid":10001,"gid":10001,"mode":288}];
        await mkdir('/out', { recursive: true });
        for (const name of await readdir('/out')) await rm(join('/out', name), { recursive: true, force: true });
        await chmod('/out', 0o700);
        await chown('/out', entries[0].uid, entries[0].gid);
        for (const entry of entries) {
          const source = join('/run/secrets', entry.name);
          const target = join('/out', entry.name);
          await rm(target, { force: true });
          await copyFile(source, target);
          await chmod(target, entry.mode);
          await chown(target, entry.uid, entry.gid);
        }
    volumes:
      - server_secrets:/out:rw
    secrets:
      - source: publisher_edge_attestation
        target: publisher_edge_attestation
      - source: mcp_edge_attestation
        target: mcp_edge_attestation
      - source: oauth_verification_bundle
        target: oauth_verification_bundle
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    logging:
      driver: json-file
      options:
        max-size: 8m
        max-file: "3"
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: server-secrets-init

  tunnel:
    image: cloudflare/cloudflared@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    user: "65532:65532"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_credential]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    logging:
      driver: json-file
      options:
        max-size: 8m
        max-file: "3"
    networks:
      app_internal:
        aliases: [tunnel]
      tunnel_egress:
        aliases: [tunnel-egress]
    depends_on:
      server:
        condition: service_healthy
      tunnel_secrets_init:
        condition: service_completed_successfully
    volumes:
      - tunnel_secrets:/run/secrets:ro
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: tunnel
    healthcheck:
      test: [CMD, cloudflared, --version]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  tunnel_secrets_init:
    image: ghcr.io/example/vault-bridge-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    user: "0:0"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 128
    entrypoint: [node]
    command:
      - --input-type=module
      - -e
      - |-
        import { chmod, chown, copyFile, mkdir, readdir, rm } from 'node:fs/promises';
        import { join } from 'node:path';
        const entries = [{"name":"tunnel_credential","uid":65532,"gid":65532,"mode":288}];
        await mkdir('/out', { recursive: true });
        for (const name of await readdir('/out')) await rm(join('/out', name), { recursive: true, force: true });
        await chmod('/out', 0o700);
        await chown('/out', entries[0].uid, entries[0].gid);
        for (const entry of entries) {
          const source = join('/run/secrets', entry.name);
          const target = join('/out', entry.name);
          await rm(target, { force: true });
          await copyFile(source, target);
          await chmod(target, entry.mode);
          await chown(target, entry.uid, entry.gid);
        }
    volumes:
      - tunnel_secrets:/out:rw
    secrets:
      - source: tunnel_credential
        target: tunnel_credential
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    logging:
      driver: json-file
      options:
        max-size: 8m
        max-file: "3"
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: tunnel-secrets-init

volumes:
  replica_data:
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: replica
  server_secrets:
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: server-secrets
  tunnel_secrets:
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: tunnel-secrets

networks:
  app_internal:
    internal: true
    labels:
      com.vault-mcp-bridge.installation-id: inst_fixture123456
      com.vault-mcp-bridge.project: vmb-a1b2c3d4e5f6
      com.vault-mcp-bridge.component: internal-network
